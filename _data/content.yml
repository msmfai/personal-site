# =============================================================================
# Single source of truth for editable site content.
#
# Two top-level keys:
#   about: drives the homepage (/) — subtitle and three bio paragraphs.
#   cv:    drives the CV page (/cv/) — identity, summary, experience,
#          education, skills, interests, and social links.
#
# How to edit:
#   * Open this file, find the block you want to change, edit the text
#     underneath. Save. The site rebuilds automatically (refresh the page).
#   * Long prose blocks use `key: |` followed by indented text. Keep the
#     four-space indentation consistent on every continuation line.
#   * Lists use `- ` for each item.
#   * Markdown formatting works inside prose blocks: **bold**, *italic*,
#     [link text](https://example.com).
#   * Do not put a line that is exactly three dashes (---) inside a block.
#   * Dates use YYYY-MM (e.g. 2024-10) or the word `present`.
# =============================================================================

# -----------------------------------------------------------------------------
# Homepage (/)
# -----------------------------------------------------------------------------

about:
  # Tagline shown under the page title on the homepage. One line.
  subtitle: Research scientist working across AI, physics, and rendering

  # First paragraph of the homepage bio. Short opener.
  intro: |
    I'm Marin Moran, a research scientist at Electronic Arts SEED. My work spans real-time generative systems, geometric deep learning, and scientific AI.

  # Second paragraph. Electronic Arts SEED stream.
  ea_seed: |
    At **Electronic Arts SEED**, I develop generative systems for AAA games under the memory, latency, and integration constraints of a shipping engine. The work sits between research and systems engineering, with an emphasis on ideas that change what can be built in real time.

  # Third paragraph. Solomonoff Consultancy stream.
  # Note: this paragraph is wrapped on the page in {% if site.show_consultancy %}
  # so it shows / hides depending on the `show_consultancy:` flag in _config.yml.
  # The text here is just the paragraph; no Liquid wrapping needed.
  solomonoff: |
    Through **Solomonoff Consultancy**, I primarily design and create evaluation frameworks for scientific reasoning in frontier AI models. The hard question is what good evaluation looks like when correctness can't be reduced to a unit test. Did the model actually learn to do physics, or did it just memorize the answer path? Open to select engagements, so get in touch if it sounds like a fit.

# -----------------------------------------------------------------------------
# CV page (/cv/)
# -----------------------------------------------------------------------------

cv:
  # ---- Identity (top of the CV) ----
  name: Dr. Marin Moran
  label: Research Scientist in AI, Physics, and Rendering
  location: Liverpool, UK
  image: ""

  # ---- Professional summary paragraph (top of the CV) ----
  summary: |
    I take methods from the physics of structured and disordered systems into machine learning and rendering, and I build instruments to measure what learned models actually know. That thread runs from symmetry-aware networks for crystal structures in my PhD, through a NeurIPS study finding no evidence that LLM confidence carries model-specific self-knowledge, to Stealthy Blue Noise in ACM Transactions on Graphics. At Electronic Arts SEED, I develop real-time generative AI for AAA games; I also design evaluation frameworks for scientific reasoning in frontier models.

  # ---- Social profiles linked at the bottom of the CV ----
  social_networks:
    - network: LinkedIn
      username: marin-moran
    - network: GitHub
      username: msmfai

  # ---- CV sections, in render order ----
  sections:
    # ---- Experience: most recent first ----
    Experience:
      - company: Electronic Arts (SEED)
        position: AI, Physics, and Rendering Research Scientist
        location: Remote, Global
        start_date: 2024-10
        end_date: present
        summary: Real-time generative AI and LLM research for AAA games
        highlights:
          - Designed neural architectures for real-time generative systems under production frame-time constraints, reducing memory use, register pressure, and ALU cost relative to deployed baselines without loss of output quality
          - Technical lead for LLM integration in real-time interactive systems, spanning architecture, fine-tuning, evaluation, and production integration
          - Led cross-functional research on LLM-driven interactive experiences from concept through working prototype
          - Conceived and led Stealthy Blue Noise, a spectral construction for sparse rendering adapted from the physics of disordered systems, accepted to SIGGRAPH for publication in ACM Transactions on Graphics

      - company: Solomonoff Consultancy
        position: Founder & Principal Consultant
        location: Remote
        start_date: 2024-02
        end_date: present
        summary: Evaluation and verification for scientific reasoning in frontier AI systems
        highlights:
          - Designed scientific-reasoning benchmarks for domains where ground truth is costly and binary correctness is insufficient
          - Led the delivery of PhD-level evaluation datasets across physics, chemistry, and drug discovery, coordinating more than 100 domain experts
          - Advised on alignment and deployment questions at the boundary of technical evaluation and responsible use

      - company: University of Liverpool, Materials Innovation Factory
        position: Post-Graduate Machine Learning Researcher
        location: Liverpool, UK
        start_date: 2019-10
        end_date: 2024-10
        summary: Symmetry-aware geometric deep learning for physical systems
        highlights:
          - Designed Site-Net (Digital Discovery, 2023), a transformer that learns invariant representations of crystal structures, infinite periodic graphs with no canonical ordering, using global self-attention over real-space supercells to capture long-range interactions
          - Established Deep InfoMax, which maximizes mutual information between local and global representations, as an effective self-supervised methodology for domains where reconstruction-based approaches are intractable (Digital Discovery, 2025)
          - Scaled training across SLURM clusters using DeepSpeed, custom CUDA kernels, and symmetry-aware optimizations via PyTorch Geometric, and built bespoke data architectures for high-throughput multi-GPU pipelines
          - Co-built a locally hosted cloud service for deploying supervised materials-informatics models, used by the Materials Innovation Factory research group

      - company: Electronic Arts
        position: Physics Software Engineer (Internship)
        location: Guildford, UK
        start_date: 2023-09
        end_date: 2024-03
        summary: Memory optimization and legacy code modernization for physics systems
        highlights:
          - Redesigned the core data architecture of a major internal Frostbite development tool, halving its memory footprint in typical workloads (~5 GB saved)
          - Built an in-engine documentation interface that surfaced the physics system's internals to non-specialist developers across the studio
          - Designed and shipped a production agentic system on GPT-3 for legacy codebase modernization, combining LLM-driven refactoring with symbolic verification to keep changes safe under deployment

