cv:
  name: Dr. Marin Moran
  label: AI Research Leader & Technical Architect
  location: Liverpool, UK
  image: ""
  summary: >-
    I develop novel neural network architectures and deploy them in production systems. During my PhD, I created transformer frameworks for materials science and scaled them across HPC clusters using distributed training. At EA SEED, I work on real-time generative AI for games, achieving substantial performance improvements in production. I advise frontier AI labs on verification frameworks for scientific reasoning in language models and on AI safety and alignment strategies. My background spans physics, chemistry, philosophy, and systems engineering. I often find that insights from one field solve problems in another, whether applying materials science principles to game AI architectures or bringing philosophical frameworks to AI safety work. I see these connections and lead teams to implement them. When leading teams, I believe the best work happens when people feel safe asking questions and challenging assumptions.

  social_networks:
    - network: LinkedIn
      username: marin-moran
    - network: GitHub
      username: msmfai

  sections:
    Experience:
      - company: Electronic Arts (SEED)
        position: AI, Physics, and Rendering Research Scientist
        location: Remote, Global
        start_date: 2024-10
        end_date: present
        summary: Leading real-time generative AI and LLM research for AAA games
        highlights:
          - Developed novel neural network architectures for real-time generative systems, demonstrating order-of-magnitude improvements over existing methods (99% memory reduction, 95% register pressure reduction, 20% ALU cost reduction) while improving output quality
          - Technical lead for LLM integration in real-time interactive systems, driving architecture design, fine-tuning methodologies, and evaluation frameworks across research and production teams
          - Led cross-functional research into LLM-powered experiences that could not have existed before, with full ownership from conceptualization to prototype
          - Solved long standing mathematical problem in sparse rendering through transfer of materials science expertise

      - company: Solomonoff Consultancy
        position: Founder & Principal Consultant
        location: Remote
        start_date: 2024-02
        end_date: present
        summary: Boutique AI consultancy specializing in scientific AI systems and safety architecture for frontier AI labs, AI training data platforms, and AI-native companies
        highlights:
          - "Scientific AI Training: Lead design and delivery of PhD-level verification datasets for frontier AI models. Coordinated 100+ domain experts across physics, chemistry, and drug discovery; personally authored substantial volume of expert-level challenges. Delivered datasets now powering frontier model capabilities"
          - "AI Safety & Ethics Advisory: Provide strategic guidance on AI alignment and responsible deployment to frontier AI organizations. Translated philosophical and technical safety literature into actionable frameworks for production systems"
          - "Verifiable AI Systems: Design verification frameworks for scientific domains where expertise is implicit and evaluation extends beyond binary correctness. Advise on constructing benchmarks that test whether models learn to do science, not just memorize it"

      - company: University of Liverpool, Materials Innovation Factory
        position: Post-Graduate Machine Learning Researcher
        location: Liverpool, UK
        start_date: 2019-10
        end_date: 2024-10
        summary: Created novel transformer architectures and representation learning frameworks for materials science
        highlights:
          - Created a novel transformer / graph architecture and representation for machine learning in the materials science / molecular domain with unstructured 3D data, respecting the underlying symmetry groups of the data
          - Developed a novel representation learning framework for transformer / graph machine learning models in the materials science / molecular domain
          - Collaborated on a locally hosted cloud service for the deployment of supervised models in the materials science / physics / chemistry domain
          - Created bespoke data architectures to facilitate high throughput, distributed and multi-GPU training on linux HPC
          - Scaled training of materials science transformer models across SLURM clusters using DeepSpeed, custom kernels and symmetry optimisations through PyTorch geometric

      - company: Electronic Arts
        position: Physics Software Engineer (Internship)
        location: Guildford, UK
        start_date: 2023-09
        end_date: 2024-03
        summary: Memory optimization and legacy code modernization for physics systems
        highlights:
          - Achieved significant memory optimizations through core data architecture redesign, reducing memory requirements by approximately 50% for typical workloads
          - Developed in-app documentation improving accessibility of physics engine for non-specialist users
          - Created AI-assisted code modernization pipeline for legacy codebase maintenance using neurosymbolic approaches

