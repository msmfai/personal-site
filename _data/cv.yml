cv:
  name: Dr. Marin Moran
  label: AI Research Scientist
  location: Liverpool, UK
  image: ""
  summary: Multi-disciplinary AI researcher with 6+ years of experience in AI. My T-shaped expertise spans scaling distributed, multi-GPU training pipelines, developing real-time AI for AAA game engines, and advancing representation learning in materials science. I have delivered consultancy ranging from organising large scale scientific RLVR data collection efforts from domain experts and designing reinforcement learning systems around that data for frontier labs, to ethics seminars grounded in philosophy and alignment literature. While I am dedicated to delivering high-quality results, I also strive to maintain an energetic, person-driven, and approachable demeanour in all things. There is no such thing as a stupid question and I want everyone on the team to feel included, valued, and heard.

  social_networks:
    - network: LinkedIn
      username: marin-moran
    - network: GitHub
      username: msmfai

  sections:
    Experience:
      - company: Electronic Arts (SEED)
        position: AI, Physics, and Rendering Research Scientist
        location: Remote, Global
        start_date: 2024-10
        end_date: present
        summary: Leading real-time generative AI and LLM research for AAA games
        highlights:
          - Developed novel neural network architectures for real-time generative systems, demonstrating order-of-magnitude improvements over existing methods (99% memory reduction, 95% register pressure reduction, 20% ALU cost reduction) while improving output quality
          - Technical lead for LLM integration in real-time interactive systems, driving architecture design, fine-tuning methodologies, and evaluation frameworks across research and production teams
          - Led cross-functional research into dynamic content generation systems that maintain game design integrity and player agency, with full ownership from conceptualization to prototype
          - Solved fundamental rendering challenges by applying physics and materials science domain expertise to production constraints
          - Authored and drove adoption of technical strategy for LLM integration in stable, completable game experiences, leading principals and senior staff
          - Established novel workflows enabling creative agency in AI-assisted content pipelines

      - company: University of Liverpool, Materials Innovation Factory
        position: Post-Graduate Machine Learning Researcher
        location: Liverpool, UK
        start_date: 2019-10
        end_date: 2024-10
        summary: Created novel transformer architectures and representation learning frameworks for materials science
        highlights:
          - Created a novel transformer / graph architecture and representation for machine learning in the materials science / molecular domain with unstructured 3D data, respecting the underlying symmetry groups of the data (PyTorch, Python tech stack)
          - Developed a novel representation learning framework for transformer / graph machine learning models in the materials science / molecular domain (PyTorch, Python tech stack)
          - Collaborated on a locally hosted cloud service for the deployment of supervised models in the materials science / physics / chemistry domain (Flask, Scikit-learn, Python tech stack)
          - Created bespoke data architectures to facilitate high throughput, distributed and multi-GPU training on linux HPC (HDF5, MongoDB, ray, python tech stack)
          - Scaled training of materials science transformer models across SLURM clusters using DeepSpeed, custom kernels and symmetry optimisations through PyTorch geometric

      - company: Solomonoff Consultancy
        position: Founder & Principal Consultant
        location: Remote
        start_date: 2024-02
        end_date: present
        summary: Boutique AI consultancy specializing in scientific AI systems and safety architecture for frontier AI labs, AI training data platforms, and AI-native companies
        highlights:
          - "Scientific AI Training: Lead design and delivery of PhD-level verification datasets for frontier AI models. Coordinated 100+ domain experts across physics, chemistry, and drug discovery; personally authored substantial volume of expert-level challenges. Delivered datasets now powering frontier model capabilities"
          - "AI Safety & Ethics Advisory: Provide strategic guidance on AI alignment and responsible deployment to frontier AI organizations. Translated philosophical and technical safety literature into actionable frameworks for production systems"
          - "Verifiable AI Systems: Design verification frameworks for scientific domains where expertise is implicit and evaluation extends beyond binary correctness. Advise on constructing benchmarks that test whether models learn to do science, not just memorize it"

      - company: Electronic Arts
        position: Physics Software Engineer (Internship)
        location: Guildford, UK
        start_date: 2023-09
        end_date: 2024-03
        summary: Memory optimization and legacy code modernization for physics systems
        highlights:
          - Achieved significant memory optimizations through core data architecture redesign, reducing memory requirements by approximately 50% for typical workloads (C++, C++/CLI, C#)
          - Developed in-app documentation improving accessibility of physics engine for non-specialist users
          - Created AI-assisted code modernization pipeline for legacy codebase maintenance using neurosymbolic approaches (Python, GPT-3.5 era)

