  summary: Multi-disciplinary AI researcher with 6+ years of experience in AI. My T-shaped expertise spans scaling distributed, multi-GPU training pipelines, developing real-time AI for AAA game engines, and advancing representation learning in materials science. I have delivered consultancy ranging from organising large scale scientific RLVR data collection efforts from domain experts and designing reinforcement learning systems around that data for frontier labs, to ethics seminars grounded in philosophy and alignment literature. While I am dedicated to delivering high-quality results, I also strive to maintain an energetic, person-driven, and approachable demeanour in all things. There is no such thing as a stupid question and I want everyone on the team to feel included, valued, and heard.

