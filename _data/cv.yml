cv:
  name: Dr. Marin Moran
  label: AI Research Leader & Technical Architect
  location: Liverpool, UK
  image: ""
  summary: >-
    I design and build machine learning systems that handle data without natural ordering, like graph structures, point clouds, and geometric configurations. My PhD focused on learning invariant representations of physical systems where no canonical ordering exists, which involved scaling training across HPC clusters using custom CUDA kernels. I now work at Electronic Arts SEED on real-time generative AI that has to run within strict frame-time budgets, where I've achieved meaningful memory and compute reductions against deployed baselines. I also advise frontier AI labs on how to evaluate scientific reasoning in their models, which matters most when ground truth is expensive to obtain and binary correctness fails to capture what good reasoning looks like. My background is in computational physics and representation learning, and my systems work covers CUDA, distributed HPC, and production deployment. I'm drawn to problems where correctness is hard to verify and where ideas from one field can unlock advances in another.

  social_networks:
    - network: LinkedIn
      username: marin-moran
    - network: GitHub
      username: msmfai

  sections:
    Experience:
      - company: Electronic Arts (SEED)
        position: AI, Physics, and Rendering Research Scientist
        location: Remote, Global
        start_date: 2024-10
        end_date: present
        summary: Real-time generative AI and LLM research for AAA games
        highlights:
          - Designed neural network architectures for real-time generative systems operating under production frame-time budgets, with substantial reductions in memory, register pressure, and ALU cost against deployed baselines and no loss of output quality
          - Technical lead for LLM integration in real-time interactive systems, driving architecture design, fine-tuning methodology, and evaluation framework design across research and production teams
          - Led cross-functional research into LLM-powered experiences that could not have existed before, with full ownership from conceptualization to working prototype
          - Solved a 50 year old problem in sparse rendering by bringing over machinery from the physics of glass (SIGGRAPH ASIA 2026)

      - company: Solomonoff Consultancy
        position: Founder & Principal Consultant
        location: Remote
        start_date: 2024-02
        end_date: present
        summary: Boutique consultancy designing verification and evaluation frameworks for scientific reasoning in frontier AI systems
        highlights:
          - Designing verification frameworks for scientific domains where ground truth is expensive to obtain and binary correctness fails to capture what good reasoning looks like. Advise on and implement benchmarks that test whether models have learned to do science rather than memorize it
          - Lead the design and delivery of PhD-level verification datasets for frontier AI models, coordinating 100+ domain experts across physics, chemistry, and drug discovery, and personally authoring a substantial volume of expert-level challenges. These datasets now power frontier model capabilities
          - Provide strategic guidance on AI alignment and responsible deployment to frontier AI organizations, translating philosophical and technical safety literature into actionable frameworks for production systems

      - company: University of Liverpool, Materials Innovation Factory
        position: Post-Graduate Machine Learning Researcher
        location: Liverpool, UK
        start_date: 2019-10
        end_date: 2024-10
        summary: Architectures and representation learning for physical systems with no canonical ordering
        highlights:
          - Designed Site-Net (Digital Discovery, 2023), a transformer architecture for learning invariant representations of crystal structures where the input is an infinite periodic graph with no canonical ordering. Combined global self-attention over real-space supercells with explicit symmetry-aware constraints to capture long-range interactions
          - Established Deep InfoMax, which maximizes mutual information between local and global representations, as an effective self-supervised methodology for domains where reconstruction-based approaches are intractable (Digital Discovery, 2025)
          - Scaled training across SLURM clusters using DeepSpeed, custom CUDA kernels, and symmetry-aware optimizations via PyTorch Geometric, and built bespoke data architectures for high-throughput multi-GPU pipelines
          - Co-built a locally hosted cloud service for deploying supervised materials-informatics models, used by the Materials Innovation Factory research group

      - company: Electronic Arts
        position: Physics Software Engineer (Internship)
        location: Guildford, UK
        start_date: 2023-09
        end_date: 2024-03
        summary: Memory optimization and legacy code modernization for physics systems
        highlights:
          - Achieved significant memory optimizations through core data architecture redesign, reducing memory requirements by approximately 50% for typical workloads
          - Developed in-app documentation improving accessibility of physics engine for non-specialist users
          - Created AI-assisted code modernization pipeline for legacy codebase maintenance using neurosymbolic approaches

