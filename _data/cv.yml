        summary: Created novel transformer architectures and representation learning frameworks for materials science
        highlights:
          - Created a novel transformer / graph architecture and representation for machine learning in the materials science / molecular domain with unstructured 3D data, respecting the underlying symmetry groups of the data (PyTorch, Python tech stack)
          - Developed a novel representation learning framework for transformer / graph machine learning models in the materials science / molecular domain (PyTorch, Python tech stack)
          - Collaborated on a locally hosted cloud service for the deployment of supervised models in the materials science / physics / chemistry domain (Flask, Scikit-learn, Python tech stack)
          - Created bespoke data architectures to facilitate high throughput, distributed and multi-GPU training on linux HPC (HDF5, MongoDB, ray, python tech stack)
          - Scaled training of materials science transformer models across SLURM clusters using DeepSpeed, custom kernels and symmetry optimisations through PyTorch geometric

