cv:
  name: Dr. Marin Moran
  label: AI Research Leader & Technical Architect
  location: Liverpool, UK
  image: ""
  summary: >-
    I design and implement machine learning systems for structured but unordered data: transformer architectures, representation learning, and verification frameworks. My PhD developed architectures for learning invariant representations of physical systems with no canonical ordering, scaled across HPC clusters with custom CUDA kernels and distributed training. At Electronic Arts SEED, I work on real-time generative AI under frame-time budgets, with documented memory and compute reductions against deployed baselines. I advise frontier AI labs on evaluation frameworks for scientific reasoning, in domains where ground truth is expensive to obtain and binary correctness is insufficient. My background is in computational physics and representation learning; my systems work spans CUDA, distributed HPC, and production deployment. I'm drawn to problems where correctness is hard to verify, where getting the structure right pays off everywhere downstream, and where insights from one field unlock progress in another.

  social_networks:
    - network: LinkedIn
      username: marin-moran
    - network: GitHub
      username: msmfai

  sections:
    Experience:
      - company: Electronic Arts (SEED)
        position: AI, Physics, and Rendering Research Scientist
        location: Remote, Global
        start_date: 2024-10
        end_date: present
        summary: Real-time generative AI and LLM research for AAA games
        highlights:
          - Designed neural network architectures for real-time generative systems operating under production frame-time budgets, with substantial reductions in memory, register pressure, and ALU cost against deployed baselines and no loss of output quality
          - Technical lead for LLM integration in real-time interactive systems, driving architecture design, fine-tuning methodology, and evaluation framework design across research and production teams
          - Led cross-functional research into LLM-powered experiences that could not have existed before, with full ownership from conceptualization to working prototype
          - Cross-applied a representation-learning technique from materials science to a problem in sparse rendering; results deployed in production

      - company: Solomonoff Consultancy
        position: Founder & Principal Consultant
        location: Remote
        start_date: 2024-02
        end_date: present
        summary: Boutique consultancy designing verification and evaluation frameworks for scientific reasoning in frontier AI systems
        highlights:
          - "Evaluation framework design: Designed verification frameworks for scientific domains where ground truth is expensive to obtain and binary correctness is insufficient. Advise on constructing benchmarks that test whether models learn to do science, not just memorize it"
          - "Scientific AI training data: Lead design and delivery of PhD-level verification datasets for frontier AI models. Coordinated 100+ domain experts across physics, chemistry, and drug discovery; personally authored a substantial volume of expert-level challenges. Datasets now power frontier model capabilities"
          - "AI safety & alignment advisory: Provide strategic guidance on AI alignment and responsible deployment to frontier AI organizations. Translate philosophical and technical safety literature into actionable frameworks for production systems"

      - company: University of Liverpool, Materials Innovation Factory
        position: Post-Graduate Machine Learning Researcher
        location: Liverpool, UK
        start_date: 2019-10
        end_date: 2024-10
        summary: Architectures and representation learning for physical systems with no canonical ordering
        highlights:
          - "Designed Site-Net (Digital Discovery, 2023): a transformer architecture for learning invariant representations of crystal structures, where the input is an infinite periodic graph with no canonical ordering. Combined global self-attention over real-space supercells with explicit symmetry-aware constraints to capture long-range interactions"
          - "Established Deep InfoMax (Digital Discovery, 2025), which maximizes mutual information between local and global representations, as an effective self-supervised methodology for domains where reconstruction-based approaches are intractable"
          - Scaled training across SLURM clusters using DeepSpeed, custom CUDA kernels, and symmetry-aware optimizations via PyTorch Geometric; built bespoke data architectures for high-throughput multi-GPU pipelines
          - Co-built a locally hosted cloud service for deploying supervised materials-informatics models, used by the Materials Innovation Factory research group

      - company: Electronic Arts
        position: Physics Software Engineer (Internship)
        location: Guildford, UK
        start_date: 2023-09
        end_date: 2024-03
        summary: Memory optimization and legacy code modernization for physics systems
        highlights:
          - Achieved significant memory optimizations through core data architecture redesign, reducing memory requirements by approximately 50% for typical workloads
          - Developed in-app documentation improving accessibility of physics engine for non-specialist users
          - Created AI-assisted code modernization pipeline for legacy codebase maintenance using neurosymbolic approaches

