        position: AI, Physics, and Rendering Research Scientist
        location: Remote, Global
        start_date: 2024-10
        end_date: present
        summary: Leading real-time generative AI and LLM research for AAA games
        highlights:
          - Engineered device optimised real-time generative neural networks, deployed to millions of players, reduced asset memory footprints by 99%, register pressure by 95%, and ALU costs by 20% compared to the original system while improving visual quality
          - Project lead in usage of LLMs in a real time context, taking full ownership of research, development and implementation of novel architectures, fine-tuning methods, and harnesses
          - Led pioneering research into what provably stable dynamic game and narrative design can look like with the use of LLMs and generative AI – full ownership from conceptualisation to prototype
          - Solved long standing fundamental mathematical problems in sparse rendering leveraging my materials science background
          - Authored companywide strategy for LLM design in designable, completable, stable video games
          - Pioneer in enabling creative agency in AI assisted artistic workflows

